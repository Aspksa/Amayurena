name: Fast checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  agent-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all JavaScript syntax
        run: |
          for file in *.js tests/*.test.cjs tests/e2e/*.cjs scripts/*.cjs; do
            node --check "$file"
          done
      - name: Run all Node regression tests
        run: node --test tests/*.test.cjs
