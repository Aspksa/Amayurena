name: Publish verified portable release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version matching project-version.json, e.g. v0.18.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  full-qa:
    uses: ./.github/workflows/full-qa.yml

  publish:
    needs: full-qa
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm release is HEAD of main and version matches
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || (echo "Release source must be the latest main" >&2; exit 1)
          node -e 'const fs=require("fs");const tag=process.env.RELEASE_TAG;const v=JSON.parse(fs.readFileSync("project-version.json","utf8")).version;if(!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)||tag!=="v"+v)throw Error("Tag and project version differ");'
      - name: Syntax and full regression suite
        run: |
          for src in *.js; do node --check "$src"; done
          node --test tests/*.test.cjs
      - name: Build and independently verify release archive
        run: |
          node scripts/release-bundle.cjs dist/Amayurena-update.zip
          node scripts/release-bundle.cjs --verify dist/Amayurena-update.zip
          sha256sum --check dist/Amayurena-update.zip.sha256
      - name: Publish only after all checks and smoke suites
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published artifacts" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/Amayurena-update.zip dist/Amayurena-update.zip.sha256 --target "$GITHUB_SHA" --title "Amayurena $RELEASE_TAG" --notes "Verified local Windows release. Full browser and Windows smoke checks passed. User data and keys are not part of the archive."
